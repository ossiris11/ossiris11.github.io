<svg width="110" height="104" viewBox="0 0 110 104" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ostapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF416C" />
      <stop offset="100%" stop-color="#FF4B2B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Badge / Screen -->
  <rect x="5" y="4" width="100" height="96" rx="28" fill="#181820" stroke="url(#ostapGrad)" stroke-width="4"/>

  <!-- Outer Ring (Letter O) -->
  <circle cx="55" cy="52" r="32" stroke="url(#ostapGrad)" stroke-width="7" filter="url(#glow)"/>

  <!-- Play Symbol inside O -->
  <polygon points="50,40 50,64 68,52" fill="white" />
</svg>
